mrs_uav_managers:

  estimation_manager:

    # loaded state estimator plugins
    state_estimators: [
      # "gps_garmin",
      # "gps_baro",
      "rtk",
    ]

    initial_state_estimator: "rtk" # will be used as the first state estimator  gps_baro  ground_truth   passthrough
    # agl_height_estimator: "" # only slightly filtered height for checking min height (not used in control feedback) garmin_agl

    # # altitude_estimator: "BARO"

    # the rtk estimator's default max_flight_z is 100.0 [m], raised here to match the world's safety area max_z
    rtk:
      alt_rtk:
        max_flight_z: 500.0 # [m]
      lat_rtk:
        max_flight_z: 500.0 # [m]
      hdg_hw_api:
        max_flight_z: 500.0 # [m]

  constraint_manager:

    default_constraints:
      rtk: "medium"

    medium:
      vertical:
        ascending:
          acceleration: 2.0 # [m/s^2]
        descending:
          acceleration: 2.0 
      horizontal:
        speed: 2.0


    # rtk's default_constraints is "slow", which is the profile actually in effect at runtime
    # slow:
    #   vertical:
    #     ascending:
    #       acceleration: 2.0 # [m/s^2]
    #     descending:
    #       acceleration: 2.0 # [m/s^2]

  uav_manager:

    takeoff:
      after_takeoff:
        controller: "MpcController"

mrs_uav_controllers:
  mpc_controller:
    mpc:
      mpc_parameters:
        horizontal:
          max_speed: 2.5        # was 2.0
          max_acceleration: 2.5 # was 2.0
        vertical:
          max_speed: 2.5        # was 2.0
          max_acceleration: 2.5 # was 2.0

mrs_uav_trajectory_generation:

  # execution time limiter
  max_time: 0.5 # [s]

  # check and fix the max deviation between the input path and the output trajectory
  # by subsampling the original path with more waypoints
  check_trajectory_deviation:
    max_deviation: 0.15 # [m]
    first_segment: false

  # allows to neglect waypoints in the original path if the new path
  # does not violate max distance from the original path.
  # This makes for similar but sparser paths, which are easier for the
  # trajectory generator to work with.
  path_straightener:
    enabled: false
    max_deviation: 0.10 # [m]
