# ROSA algorithm parameters, carried over from FC-Planner's rosa/launch/pylon-34.launch
# (the values the manual "skeleton" tmux window used to launch with).
rosa:
  radius: 0.1                # mahalanobis-distance neighbor search radius
  num_drosa: 5               # drosa optimization iterations (was 5; more lets symmetry normals converge at junctions)
  num_dcrosa: 2                # dcrosa (discrete contraction) iterations
  k_KNN: 6                    # surface k-NN neighborhood size
  sample_r: 0.05               # skeleton vertex sampling radius
  alpha: 0.3                  # recentering blend factor (projection vs. euclidean center)
  pt_downsample_size: 0.02    # voxel-grid downsample leaf, fixed (no longer grown to a point budget)
  # radius / sample_r / pt_downsample_size are fractions of norm_scale; it is fixed per run (instead of
  # the growing map's bounding box) so their metric size doesn't change as the map grows
  norm_scale: 0.0             # [m]; <= 0: max(zone_x, zone_y, zone_z) from world_info.yaml
  input_resolution: 0.2       # [m] octomap resolution; the leaf is rounded to a multiple of it and the
                              # voxel grid is world-anchored, so unchanged map regions downsample identically
  # dcROSA shrink onto the local principal line. It was a silent no-op in the port (math bug), so
  # false = the behavior you've been running; true = actually shrink, with a soft weight ramping
  # 0 -> 1 between shrink_conf_low and shrink_conf_high (PCA confidence, range [1/3, 1])
  dcrosa_shrink: false
  shrink_conf_low: 0.4
  shrink_conf_high: 0.6
  estimation_number: 10       # k-NN size for normal estimation
  ground: false                # synthesize a pseudo-ground point cloud beneath the input

min_z: 0.2                    # input octomap points below this z are filtered out before ROSA

# bounds on the aligned source skeleton's height, as multiples of world_info.yaml's zone_z
# (converted to RANSAC scale limits once the source skeleton arrives)
alignment:
  min_height_ratio: 0.5
  max_height_ratio: 2.0
  # RANSAC score = sum over target skeleton points of min(d^2, score_truncation^2), d = NN distance to the
  # aligned source skeleton in live-world meters; caps the influence of spurious/unstable skeleton parts
  score_truncation: 4.0         # [m]
  # penalty for hypotheses that put the aligned source skeleton into known-free space (it should lie
  # inside the object), checked against the global octomap. A source point counts as "free" when its
  # voxel is known free AND no occupied voxel is within `margin` (the skeleton runs through the middle
  # of the object, which can itself be observed free, e.g. the hollow inside of a lattice pylon).
  # penalty = weight * score_truncation^2 * |target points| * (fraction of free source points),
  # i.e. weight 1.0 makes a fully-free source cost as much as every target point being a maximal mismatch
  free_space:
    enabled: true
    weight: 1.0
    margin: 1.5                 # [m]
  viewpoint_offset: 2.5        # [m] each aligned viewpoint is shifted this far along its normal before publishing
  # temporal filter on the RANSAC result, using precomputed/stability/eps_* as the yardstick:
  # a new best within near_factor x eps (height, yaw, trans) of the current transform is blended in
  # by `rate` per callback; a farther one is ignored until it persists for switch_after callbacks in a row
  blend:
    enabled: true
    near_factor: 3.0
    rate: 0.1                   # 0..1 fraction moved towards the new best per callback
    switch_after: 3

# offline-precomputed FC-Planner coverage paths; paths_dir is set from the launch file (paths_dir arg)
precomputed:
  apply_residual_scale: true   # true: also scale the selected path by estimate scale / path scale (changes the planned stand-off)
  # hysteresis on the height-bin choice: the current path is kept until another one's height is closer
  # to the estimate by more than this (bins are 5 m apart, so 1.0 m = a 1 m dead band around each boundary)
  selection:
    margin: 1.0                # [m]; 0 = plain nearest bin
  # stable when the window is full and every estimate in it is within these of the newest one
  stability:
    window: 10                 # last N estimates
    eps_height: 2.0             # [m] |height_i - height|
    eps_yaw_deg: 5.0            # [deg] wrapped |yaw_i - yaw|
    eps_trans: 1.0              # [m] |t_i - t| (XY)
